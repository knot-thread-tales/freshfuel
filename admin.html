<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — FreshFuel</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="icons/favicon-32.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

  <!-- ── Login ─────────────────────────────────── -->
  <div id="loginScreen" class="admin-login">
    <form id="loginForm" class="admin-login__card">
      <h1 style="display:flex;align-items:center;justify-content:center;gap:10px;"><img src="icons/icon-192.png" alt="FreshFuel logo" style="width:32px;height:32px;border-radius:8px;"> FreshFuel</h1>
      <p>Admin sign in</p>
      <input type="email" id="loginEmail" placeholder="Email" required autocomplete="username">
      <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password">
      <button type="submit" class="btn btn--primary w-full">Sign In</button>
      <p id="loginError" class="admin-login__error" hidden></p>
      <p class="admin-login__note">No public sign-up — create your account in the Supabase Dashboard under Authentication → Users.</p>
    </form>
  </div>

  <!-- ── Dashboard ─────────────────────────────── -->
  <div id="dashboard" class="admin-dash" hidden>
    <button id="menuToggle" class="admin-menu-toggle" aria-label="Toggle menu">☰</button>
    <aside class="admin-sidebar">
      <div class="admin-sidebar__brand">
        <span style="display:flex;align-items:center;gap:8px;"><img src="icons/icon-192.png" alt="" style="width:22px;height:22px;border-radius:6px;"> FreshFuel Admin</span>
        <button id="sidebarClose" class="admin-sidebar__close" aria-label="Close menu">✕</button>
      </div>
      <nav id="adminNav" class="admin-sidebar__nav">
        <button data-view="menu_items" class="admin-nav-btn active"><span>🥣</span> Menu Items</button>
        <button data-view="packages" class="admin-nav-btn"><span><svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg></span> Packages</button>
        <button data-view="orders" class="admin-nav-btn"><span>🧾</span> Orders</button>
        <button data-view="business_settings" class="admin-nav-btn"><span>⚙️</span> Settings</button>
      </nav>
      <button id="logoutBtn" class="admin-sidebar__logout">⏻ Sign Out</button>
    </aside>
    <div id="sidebarBackdrop" class="admin-sidebar-backdrop"></div>

    <main class="admin-main">
      <header class="admin-main__header">
        <h1 id="viewTitle">Menu Items</h1>
        <button id="addBtn" class="btn btn--primary btn--sm">+ Add</button>
      </header>
      <div id="viewBody" class="admin-view-body"></div>
    </main>
  </div>

  <!-- ── Record Editor Modal ───────────────────── -->
  <div id="recordModal" class="admin-modal" hidden>
    <div class="admin-modal__card">
      <button id="recordModalClose" class="admin-modal__close" aria-label="Close">&times;</button>
      <h2 id="recordModalTitle">Edit</h2>
      <form id="recordForm"></form>
    </div>
  </div>

  <div id="adminToastHost"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
